services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "file:/app/prisma/data/dev.db"
    volumes:
      - sqlite_data:/app/prisma/data
    restart: unless-stopped

volumes:
  sqlite_data:
